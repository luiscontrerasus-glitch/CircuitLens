# Requires a connected repository and a paid disk-capable service; do not provision silently.
services:
  - type: web
    name: circuitlens
    runtime: node
    plan: 1c-2g
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    disk:
      name: vision-usage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_API_KEY
        sync: false
      - key: VISION_ACCESS_CODE
        generateValue: true
      - key: VISION_DAILY_LIMIT
        value: 20
      - key: VISION_USAGE_FILE
        value: /var/data/vision-usage.json
