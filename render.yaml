# $0 demo deployment: no disk, database, API credentials or paid service.
# Use a workspace with no payment method to prevent metered overage charges.
services:
  - type: web
    name: circuitlens-free
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LIVE_VISION_ENABLED
        value: "false"
      - key: VISION_PROVIDER
        value: gemini
      - key: GEMINI_FREE_TIER_CONFIRMED
        value: "false"
